<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset=".55" stop-color="#2f5bea"/>
      <stop offset="1" stop-color="#1e3fae"/>
    </linearGradient>
    <radialGradient id="glow" cx=".28" cy=".18" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9efff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a65"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a7d"/>
      <stop offset="1" stop-color="#1b2550"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15a34a"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24346e"/>
      <stop offset="1" stop-color="#121c45"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0a1f6b" flood-opacity=".38"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#062b16" flood-opacity=".35"/>
    </filter>
    <clipPath id="pageClip">
      <rect x="96" y="118" width="300" height="290" rx="44"/>
    </clipPath>
  </defs>

  <!-- background tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="6"/>

  <!-- calendar page -->
  <g filter="url(#shadow)">
    <rect x="96" y="118" width="300" height="290" rx="44" fill="url(#page)"/>
  </g>
  <g clip-path="url(#pageClip)">
    <rect x="96" y="118" width="300" height="86" fill="url(#header)"/>
    <rect x="96" y="204" width="300" height="6" fill="#000" fill-opacity=".08"/>
  </g>
  <!-- header holes and binder rings -->
  <circle cx="176" cy="150" r="13" fill="#b4213c" fill-opacity=".55"/>
  <circle cx="316" cy="150" r="13" fill="#b4213c" fill-opacity=".55"/>
  <rect x="163" y="82" width="26" height="76" rx="13" fill="url(#ring)"/>
  <rect x="303" y="82" width="26" height="76" rx="13" fill="url(#ring)"/>
  <rect x="169" y="90" width="7" height="40" rx="3.5" fill="#fff" fill-opacity=".35"/>
  <rect x="309" y="90" width="7" height="40" rx="3.5" fill="#fff" fill-opacity=".35"/>

  <!-- the age -->
  <text x="246" y="358" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-weight="900" font-size="150" letter-spacing="-6" fill="url(#num)">18</text>

  <!-- verified badge -->
  <g filter="url(#badgeShadow)">
    <circle cx="384" cy="384" r="80" fill="#fff"/>
    <circle cx="384" cy="384" r="66" fill="url(#badge)"/>
  </g>
  <path d="M352 386l22 22 44-48" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
